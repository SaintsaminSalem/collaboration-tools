<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 12px; background: #f8fafc; }
    .wrap {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 12px 16px;
    }
    .count {
      font-size: 28px; font-weight: 700; min-width: 48px; text-align: center;
      color: #4f46e5;
    }
    button {
      border: 1px solid #ddd; background: #fff; border-radius: 8px;
      width: 36px; height: 36px; font-size: 18px; cursor: pointer;
    }
    button:hover { background: #f3f4f6; }
    .label { font-size: 12px; color: #6b7280; margin-left: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="dec">−</button>
    <div class="count" id="count">0</div>
    <button id="inc">+</button>
    <span class="label">Counter plugin</span>
  </div>
  <script>
    // Minimal host bridge
    const pending = new Map();
    let reqId = 0;

    function callHost(method, params) {
      return new Promise((resolve, reject) => {
        const id = ++reqId;
        pending.set(id, { resolve, reject });
        parent.postMessage({ source: "collab-plugin", id, method, params }, "*");
      });
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.source !== "collab-host") return;
      if (data.id && pending.has(data.id)) {
        const { resolve, reject } = pending.get(data.id);
        pending.delete(data.id);
        if (data.error) reject(new Error(data.error));
        else resolve(data.result);
      }
      if (data.method === "storage:changed") {
        applyValue(data.params?.value);
      }
    });

    function applyValue(v) {
      const n = typeof v === "number" ? v : 0;
      document.getElementById("count").textContent = String(n);
    }

    async function init() {
      try {
        const value = await callHost("storage.get", {});
        applyValue(value ?? 0);
      } catch (e) {
        applyValue(0);
      }
    }

    async function setCount(n) {
      applyValue(n);
      await callHost("storage.set", { value: n });
    }

    document.getElementById("inc").onclick = async () => {
      const cur = Number(document.getElementById("count").textContent) || 0;
      await setCount(cur + 1);
    };
    document.getElementById("dec").onclick = async () => {
      const cur = Number(document.getElementById("count").textContent) || 0;
      await setCount(cur - 1);
    };

    init();
  </script>
</body>
</html>
